<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Germalcide</title>
  <meta name="description" content="Get in touch with Germalcide.">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1a18'/><path d='M8 3v10M3 8h10' stroke='%23e7e0d3' stroke-width='1.4'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav label" aria-label="Main">
      <a href="index.html">Index</a>
      <a href="galleries.html">Gallery</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <a class="site-social label" href="https://www.instagram.com/germalcide/" target="_blank" rel="noopener">@germalcide</a>
  </header>
  <hr class="site-rule">

  <main class="contact">
    <h1 class="contact__title display">Get in touch</h1>

    <div class="contact__cols">
      <div>
        <p class="label" style="margin:0;color:var(--ink-faint)">01 — Details</p>
        <p class="contact__lede">Bookings, collaborations, prints, or just to say hello — send a message and I'll get back to you.</p>
        <dl class="contact__rows label" id="rows">
          <div class="contact__row">
            <dt>Instagram</dt>
            <dd><a href="https://www.instagram.com/germalcide/" target="_blank" rel="noopener">@germalcide ↗</a></dd>
          </div>
        </dl>
      </div>

      <div>
        <p class="label" style="margin:0 0 18px;color:var(--ink-faint)">02 — Message</p>
        <form class="form" id="contact-form" novalidate>
          <div class="field">
            <label class="label" for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label class="label" for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="label" for="subject">Subject <small>(optional)</small></label>
            <input id="subject" name="subject" type="text">
          </div>
          <div class="field">
            <label class="label" for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <div class="honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <button class="button label" type="submit" id="submit">Send message</button>
          <p class="form__msg label" id="form-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer label">
    <span>© 2026 <span data-site-name>Germalcide</span></span>
    <a href="https://www.instagram.com/germalcide/" target="_blank" rel="noopener" style="text-decoration:none">Instagram ↗</a>
  </footer>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>
  <script src="js/config.js?v=6"></script>
  <script src="js/site.js?v=6"></script>
  <script src="js/contact.js?v=6"></script>
</body>
</html>
