<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection — Germalcide</title>
  <meta name="description" content="Photographs by Germalcide.">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1a18'/><path d='M8 3v10M3 8h10' stroke='%23e7e0d3' stroke-width='1.4'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body class="page-carousel">
  <header class="site-header">
    <nav class="site-nav label" aria-label="Main">
      <a href="index.html">Index</a>
      <a href="galleries.html" aria-current="page">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="site-social label" href="https://www.instagram.com/germalcide/" target="_blank" rel="noopener">@germalcide</a>
  </header>
  <hr class="site-rule">

  <main class="stage" id="stage">
    <div class="carousel" id="carousel" aria-label="Photographs — click a photo to enlarge">
      <div class="carousel__track" id="track"></div>
    </div>
    <p class="status label is-loading" id="status" role="status">Summoning photos…</p>
  </main>

  <div class="under">
    <a class="button label" id="full-gallery" href="gallery.html">View full gallery
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M1 6h10M7 2l4 4-4 4"/></svg>
    </a>
    <p class="caption label" id="caption"></p>
  </div>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>
  <script src="js/config.js?v=7"></script>
  <script src="js/site.js?v=7"></script>
  <script src="js/photos.js?v=7"></script>
  <script src="js/carousel.js?v=7"></script>
  <script src="js/collection.js?v=7"></script>
</body>
</html>
